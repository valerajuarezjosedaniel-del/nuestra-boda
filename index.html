<script>/* Nuestra Boda: los datos se guardan en el teléfono y se sincronizan con su hoja de Google.
   Imita la base de datos que usaba la versión web, así el resto de la app funciona igual. */
(function () {
  'use strict';
  var N = window.Nativo || null;
  var KEY = 'boda.v1';
  var CLAVE = '';
  // El enlace de su hoja ya viene puesto: solo hay que elegir de quién es el teléfono
  var URL_DEFECTO = '';
  var SEMILLAS = /*SEMILLAS*/[];
  var COLS = ['gastos', 'pendientes', 'invitados', 'ajustes'];
  var OTRO = { Daniel: 'Sandra', Sandra: 'Daniel' };

  function native(fn) {
    var a = Array.prototype.slice.call(arguments, 1);
    try { if (N && typeof N[fn] === 'function') return N[fn].apply(N, a); } catch (e) { /* sin puente */ }
    return undefined;
  }
  var now = function () { return Date.now(); };
  var uid = function () { return now().toString(36) + Math.random().toString(36).slice(2, 8); };
  var clone = function (o) { return JSON.parse(JSON.stringify(o == null ? {} : o)); };
  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ESC[c]; }); };
  // Código de conexión: el enlace de la hoja y la clave juntos (el iPhone no trae la clave adentro)
  function codigoDe(u, k) { return btoa(JSON.stringify({ u: u, k: k })).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function leerCodigo(txt) {
    txt = String(txt || '').trim();
    var m = /[#&?]c=([A-Za-z0-9_\-]+)/.exec(txt) || /^([A-Za-z0-9_\-]{30,})$/.exec(txt);
    if (!m) return null;
    try {
      var b = m[1].replace(/-/g, '+').replace(/_/g, '/');
      while (b.length % 4) b += '=';
      var o = JSON.parse(atob(b));
      return o && o.u && o.k ? { u: String(o.u), k: String(o.k) } : null;
    } catch (e) { return null; }
  }

  /* ---------- Tema y barras del sistema ---------- */
  (function () {
    var dark = false;
    if (N && typeof N.isDark === 'function') { try { dark = !!N.isDark(); } catch (e) { /* */ } } else if (window.matchMedia) dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    native('setBars', '#2C2925', '#2C2925', false, false);
  })();
  window.onSystemTheme = function (dark) { document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light'); };

  /* ---------- Almacén local ---------- */
  function blank() {
    var db = {};
    COLS.forEach(function (c) { db[c] = {}; });
    return { v: 1, db: db, outbox: {}, me: '', url: '', rev: 0, lastOk: 0, lastErr: '', seeded: false, vistos: {} };
  }
  function load() {
    var raws = [];
    if (N) raws.push(native('load'));
    try { raws.push(localStorage.getItem(KEY)); } catch (e) { /* */ }
    var s = null;
    for (var i = 0; i < raws.length && !s; i++) { if (raws[i]) { try { s = JSON.parse(raws[i]); } catch (e) { s = null; } } }
    var b = blank();
    if (!s || typeof s !== 'object') return b;
    s.db = s.db || {};
    COLS.forEach(function (c) { if (!s.db[c]) s.db[c] = {}; });
    Object.keys(b).forEach(function (k) { if (s[k] === undefined) s[k] = b[k]; });
    return s;
  }
  var ST = load();
  if (!ST.url && URL_DEFECTO) { ST.url = URL_DEFECTO; ST.rev = 0; }
  var desdeEnlace = leerCodigo(location.hash);
  if (desdeEnlace) {
    if (desdeEnlace.u !== ST.url) {
      ST.url = desdeEnlace.u;
      ST.rev = 0;
      Object.keys(ST.db).forEach(function (c) { Object.keys(ST.db[c]).forEach(function (id) { ST.outbox[c + '/' + id] = 1; }); });
    }
    ST.key = desdeEnlace.k;
    persist();
  }
  var saveT = 0;
  function persist() {
    clearTimeout(saveT);
    saveT = 0;
    var raw = JSON.stringify(ST);
    if (N) native('save', raw);

  function metaLine(x) {
    if (x.origen === 'invitacion') return '<p class="meta">Confirmó desde la invitación.</p>';
    if (x.origen === 'notas') return '<p class="meta">Pasado de las notas de Daniel.</p>';
    if (!x.creadoPor) return '';
    const w = who(x.creadoPor);
    return '<p class="meta">' + (w === 'ti' ? 'Lo anotaste tú' : 'Lo anotó ' + esc(w)) + (x.creadoEn ? ' el ' + fmtMs(x.creadoEn) : '') + '.</p>';
  }
  const actsHTML = (id, del, save, label) => '<div class="acts">' + (id ? '<button class="btn danger" data-act="' + del + '" data-id="' + esc(id) + '">Eliminar</button>' : '<button class="btn" data-act="close">Cancelar</button>') +
    '<button class="btn fill" data-act="' + save + '" data-id="' + esc(id || '') + '">' + label + '</button></div>';

  // Números de Venezuela: 0412-1234567 → 584121234567
  function waNumber(t) {
    let d = String(t || '').replace(/\D/g, '');
    if (!d) return '';
    if (d.indexOf('58') === 0 && d.length >= 12) return d;
    if (d.charAt(0) === '0') d = d.slice(1);
    return d.length === 10 ? '58' + d : d;
  }
  function waLink(i) {
    const link = (S.aj.enlace || '').trim();
    const quien = String(i.nombre || '').split(',')[0].trim();
    const msg = 'Hola, ' + quien + '. Te escriben Sandra y Daniel: ¿nos confirmas si nos acompañas el 28 de noviembre?' + (link ? ' Aquí está la invitación: ' + link : '') + ' ¡Te esperamos!';
    return 'https://wa.me/' + waNumber(i.tel) + '?text=' + encodeURIComponent(msg);
  }

  /* ---------- Escribir en la base compartida ---------- */
  function write(fn, okMsg) {
    if (!S.db || !S.canWrite) { toast('Esta vista es solo de lectura'); return Promise.resolve(false); }
    const fail = (e) => {
      const c = e && e.code;
      if (c === 'invalid_argument') { S.canWrite = false; render(); toast('No tienes permiso para anotar aquí'); } else if (c === 'quota_exceeded') toast('Se llenó el espacio de datos');
      else toast('No se pudo guardar. Revisa tu conexión');
      return false;
    };
    return Promise.resolve().then(fn).then(() => { if (okMsg) toast(okMsg); return true; }, (e) => {
      if (e && e.code === 'unavailable') return new Promise((r) => setTimeout(r, 400 + Math.random() * 600)).then(fn).then(() => { if (okMsg) toast(okMsg); return true; }, fail);
      return fail(e);
    });
  }
  const col = (name) => S.db.collection(name);
  function removeWithUndo(name, item, label) {
    const data = Object.assign({}, item);
    delete data.id;
    closeTop();
    write(() => col(name).doc(item.id).delete()).then((ok) => { if (ok) toast(label + ' eliminado', () => write(() => col(name).doc(item.id).set(data), 'Listo, volvió a la lista')); });
  }

  /* ---------- Acciones ---------- */
  const ACT = {};
  ACT.tab = (ds) => { UI.tab = ds.tab; render(); window.scrollTo(0, 0); };
  ACT.close = () => { closeTop(); };
  ACT.fold = () => { UI.showDone = !UI.showDone; render(); };
  ACT.undo = () => { const f = toastUndo; toastUndo = null; $('#toast').classList.remove('on'); if (f) f(); };

  ACT.gasto = (ds) => {
    const g = ds.id ? S.gastos.find((x) => x.id === ds.id) : { concepto: '', cat: 'lugar', monto: '', moneda: 'USD', estado: 'pagado', abonado: '', quien: '', fecha: '', nota: '' };
    if (!g) return;
    const ro = !S.canWrite;
    const sh = openSheet('<h3 class="sh-t">' + (ds.id ? (ro ? 'Gasto' : 'Editar gasto') : 'Nuevo gasto') + '</h3>' +
      '<label class="fld"><span>Concepto</span><input class="inp" name="concepto" value="' + esc(g.concepto) + '" placeholder="Ej: torta, DJ, flores" autocomplete="off"></label>' +
      '<label class="fld"><span>Categoría</span><select class="inp" name="cat">' + CATS.map((c) => '<option value="' + c[0] + '"' + (c[0] === g.cat ? ' selected' : '') + '>' + c[1] + '</option>').join('') + '</select></label>' +
      '<label class="fld"><span>Monto</span><input class="inp big" name="monto" inputmode="decimal" autocomplete="off" placeholder="0" value="' + (g.monto === '' ? '' : esc(g.monto)) + '"></label>' +
      '<div class="seg">' + radio('moneda', 'USD', 'Dólares', g.moneda !== 'USDT') + radio('moneda', 'USDT', 'USDT', g.moneda === 'USDT') + '</div><p class="prev" data-prev="monto"></p>' +
      '<div class="fld"><span>Cómo va</span><div class="seg">' + radio('estado', 'pagado', 'Pagado', g.estado === 'pagado' || !g.estado) + radio('estado', 'abonado', 'Abonado', g.estado === 'abonado') + radio('estado', 'porpagar', 'Por pagar', g.estado === 'porpagar') + '</div></div>' +
      '<label class="fld" data-if="estado=abonado"><span>¿Cuánto se ha abonado?</span><input class="inp" name="abonado" inputmode="decimal" autocomplete="off" value="' + (g.abonado ? esc(g.abonado) : '') + '"></label>' +
      '<label class="fld"><span>¿Quién pagó?</span><select class="inp" name="quien"><option value="">Sin indicar</option>' + ['daniel', 'sandra', 'ambos'].map((k) => '<option value="' + k + '"' + (g.quien === k ? ' selected' : '') + '>' + NOMBRE[k] + '</option>').join('') + '</select></label>' +
      '<label class="fld"><span>Fecha (opcional)</span><input class="inp" type="date" name="fecha" value="' + esc(g.fecha || '') + '"></label>' +
      '<label class="fld"><span>Nota (opcional)</span><textarea class="inp" name="nota" placeholder="Proveedor, teléfono, qué incluye">' + esc(g.nota || '') + '</textarea></label>' +
      metaLine(g) + (ro ? '' : actsHTML(ds.id, 'delGasto', 'saveGasto', 'Guardar')));
    if (!ds.id) { try { $('[name=concepto]', sh).focus({ preventScroll: true }); } catch (e) { /* */ } }
  };
  ACT.saveGasto = (ds, el) => {
    const sh = el.closest('.sheet');
    const f = formData(sh);
    const concepto = (f.concepto || '').trim();
    if (!concepto) return bad(sh, 'concepto', 'Escribe en qué fue el gasto');
    const monto = parseAmount(f.monto);
    if (!(monto > 0)) return bad(sh, 'monto', 'Escribe el monto');
    let abonado = 0;
    if (f.estado === 'abonado') {
      abonado = parseAmount(f.abonado);
      if (!(abonado > 0)) return bad(sh, 'abonado', 'Escribe cuánto se ha abonado');
      if (abonado > monto) return bad(sh, 'abonado', 'El abono no puede ser mayor que el monto');
    }
    const data = { concepto: concepto, cat: f.cat || 'otros', monto: r2(monto), moneda: f.moneda === 'USDT' ? 'USDT' : 'USD', estado: f.estado || 'pagado', abonado: r2(abonado), quien: f.quien || '', fecha: f.fecha || '', nota: (f.nota || '').trim(), editadoEn: Date.now() };
    closeTop();
    if (ds.id) write(() => col('gastos').doc(ds.id).update(data), 'Gasto guardado');
    else write(() => col('gastos').add(Object.assign(data, { creadoPor: S.me || '', creadoEn: Date.now() })), 'Gasto anotado');
  };
  ACT.delGasto = (ds) => { const g = S.gastos.find((x) => x.id === ds.id); if (g) removeWithUndo('gastos', g, 'Gasto'); };

  ACT.pres = () => {
    const p = +S.aj.presupuesto || 0;
    openSheet('<h3 class="sh-t">Presupuesto de la boda</h3><p class="sub">Lo máximo que quieren gastar entre los dos, en dólares.</p>' +
      '<label class="fld"><span>Presupuesto</span><input class="inp big" name="monto" inputmode="decimal" autocomplete="off" placeholder="0" value="' + (p ? p : '') + '"></label><p class="prev" data-prev="monto"></p>' +
      '<div class="acts"><button class="btn" data-act="close">Cancelar</button><button class="btn fill" data-act="savePres">Guardar</button></div>');
  };
  ACT.savePres = (ds, el) => {
    const sh = el.closest('.sheet');
    const raw = (formData(sh).monto || '').trim();
    const v = raw ? parseAmount(raw) : 0;
    if (raw && !(v >= 0)) return bad(sh, 'monto', 'Escribe solo números');
    closeTop();
    write(() => S.db.doc('ajustes/boda').set(Object.assign({}, S.aj, { presupuesto: r2(v) })), v ? 'Presupuesto guardado' : 'Presupuesto quitado');
  };

  ACT.pend = (ds) => {
    const p = ds.id ? S.pend.find((x) => x.id === ds.id) : { texto: '', responsable: 'ambos', fecha: '', nota: '' };
    if (!p) return;
    const ro = !S.canWrite;
    openSheet('<h3 class="sh-t">' + (ds.id ? 'Pendiente' : 'Nuevo pendiente') + '</h3>' +
      '<label class="fld"><span>Qué hay que hacer</span><textarea class="inp" name="texto" placeholder="Ej: ir a medirse el traje">' + esc(p.texto) + '</textarea></label>' +
      '<div class="fld"><span>¿Quién se encarga?</span><div class="seg">' + ['daniel', 'sandra', 'ambos'].map((k) => radio('responsable', k, NOMBRE[k], (p.responsable || 'ambos') === k)).join('') + '</div></div>' +
      '<label class="fld"><span>Para cuándo (opcional)</span><input class="inp" type="date" name="fecha" value="' + esc(p.fecha || '') + '"></label>' +
      '<label class="fld"><span>Nota (opcional)</span><textarea class="inp" name="nota">' + esc(p.nota || '') + '</textarea></label>' +
      metaLine(p) + (ro ? '' : actsHTML(ds.id, 'delPend', 'savePend', 'Guardar')));
  };
  ACT.savePend = (ds, el) => {
    const sh = el.closest('.sheet');
    const f = formData(sh);
    const texto = (f.texto || '').trim();
    if (!texto) return bad(sh, 'texto', 'Escribe qué hay que hacer');
    const data = { texto: texto, responsable: f.responsable || 'ambos', fecha: f.fecha || '', nota: (f.nota || '').trim() };
    closeTop();
    if (ds.id) write(() => col('pendientes').doc(ds.id).update(data), 'Pendiente guardado');
    else write(() => col('pendientes').add(Object.assign(data, { hecho: false, hechoEn: 0, hechoPor: '', creadoPor: S.me || '', creadoEn: Date.now() })), 'Pendiente anotado');
  };
  ACT.delPend = (ds) => { const p = S.pend.find((x) => x.id === ds.id); if (p) removeWithUndo('pendientes', p, 'Pendiente'); };
  ACT.togglePend = (ds) => {
    const p = S.pend.find((x) => x.id === ds.id);
    if (!p) return;
    const h = !p.hecho;
    const upd = { hecho: h, hechoEn: h ? Date.now() : 0, hechoPor: h ? S.me || '' : '' };
    Object.assign(p, upd);
    render();
    write(() => col('pendientes').doc(p.id).update(upd)).then((ok) => { if (ok && h) toast('Hecho', () => write(() => col('pendientes').doc(p.id).update({ hecho: false, hechoEn: 0, hechoPor: '' }))); });
  };
  function quickPend() {
    const inp = $('#qp');
    if (!inp) return;
    const texto = inp.value.trim();
    if (!texto) { inp.focus(); return; }
    inp.value = '';
    write(() => col('pendientes').add({ texto: texto, responsable: 'ambos', fecha: '', nota: '', hecho: false, hechoEn: 0, hechoPor: '', creadoPor: S.me || '', creadoEn: Date.now() }), 'Pendiente anotado');
  }
  ACT.qp = quickPend;

  ACT.inv = (ds) => {
    const i = ds.id ? S.inv.find((x) => x.id === ds.id) : { nombre: '', lado: 'daniel', personas: 1, estado: 'pendiente', nota: '' };
    if (!i) return;
    const ro = !S.canWrite;
    UI.personas = Math.max(1, +i.personas || 1);
    openSheet('<h3 class="sh-t">' + (ds.id ? 'Invitado' : 'Nuevo invitado') + '</h3>' +
      '<label class="fld"><span>Nombre</span><input class="inp" name="nombre" value="' + esc(i.nombre) + '" placeholder="Ej: Lela, su mamá y su esposo" autocomplete="off"></label>' +
      '<label class="fld"><span>Teléfono (opcional)</span><input class="inp" name="tel" type="tel" inputmode="tel" value="' + esc(i.tel || '') + '" placeholder="Ej: 0412-1234567" autocomplete="off"></label>' +
      '<div class="fld"><span>Invitado de</span><div class="seg">' + radio('lado', 'daniel', 'Daniel', i.lado === 'daniel') + radio('lado', 'sandra', 'Sandra', i.lado === 'sandra') + radio('lado', '', 'Los dos', i.lado !== 'daniel' && i.lado !== 'sandra') + '</div></div>' +
      '<div class="fld"><span>¿Cuántas personas son?</span><div class="stepper"><button data-act="step" data-d="-1" aria-label="Una menos">−</button><output id="pers">' + UI.personas + '</output><button data-act="step" data-d="1" aria-label="Una más">+</button></div></div>' +
      '<div class="fld"><span>Estado</span><div class="seg">' + Object.keys(ESTADO_INV).map((k) => radio('estado', k, ESTADO_INV[k], (i.estado || 'pendiente') === k)).join('') + '</div></div>' +
      '<label class="fld"><span>Mesa (opcional)</span><input class="inp" name="mesa" value="' + esc(i.mesa || '') + '" placeholder="Ej: 4" autocomplete="off"></label>' +
      '<label class="fld"><span>' + (i.origen === 'invitacion' ? 'Su mensaje' : 'Nota (opcional)') + '</span><textarea class="inp" name="nota" rows="' + Math.min(9, Math.max(2, Math.ceil(String(i.nota || '').length / 38))) + '" placeholder="Ej: si se abre un espacio">' + esc(i.nota || '') + '</textarea></label>' +
      (i.tel && waNumber(i.tel) ? '<a class="btn wide" href="' + esc(waLink(i)) + '" target="_blank" rel="noopener">Escribirle por WhatsApp</a>' : '') +
      metaLine(i) + (ro ? '' : actsHTML(ds.id, 'delInv', 'saveInv', 'Guardar')));
  };
  ACT.step = (ds) => { UI.personas = Math.min(30, Math.max(1, UI.personas + +ds.d)); const o = $('#pers'); if (o) o.textContent = UI.personas; };
  ACT.saveInv = (ds, el) => {
    const sh = el.closest('.sheet');
    const f = formData(sh);
    const nombre = (f.nombre || '').trim();
    if (!nombre) return bad(sh, 'nombre', 'Escribe el nombre');
    const data = { nombre: nombre, lado: f.lado || '', personas: UI.personas, estado: f.estado || 'pendiente', nota: (f.nota || '').trim(), tel: (f.tel || '').trim(), mesa: (f.mesa || '').trim() };
    closeTop();
    if (ds.id) write(() => col('invitados').doc(ds.id).update(data), 'Invitado guardado');
    else write(() => col('invitados').add(Object.assign(data, { creadoPor: S.me || '', creadoEn: Date.now() })), 'Invitado anotado');
  };
  ACT.delInv = (ds) => { const i = S.inv.find((x) => x.id === ds.id); if (i) removeWithUndo('invitados', i, 'Invitado'); };
  ACT.cupo = () => {
    openSheet('<h3 class="sh-t">Cupo e invitación</h3><p class="sub">El cupo es cuántas personas caben en la Quinta. El enlace de la invitación se agrega a los mensajes de WhatsApp.</p>' +
      '<label class="fld"><span>Cupo de personas</span><input class="inp big" name="cupo" inputmode="numeric" autocomplete="off" placeholder="0" value="' + (+S.aj.cupo || '') + '"></label>' +
      '<label class="fld"><span>Enlace de la invitación (opcional)</span><input class="inp" name="enlace" type="url" inputmode="url" autocomplete="off" placeholder="https://…" value="' + esc(S.aj.enlace || '') + '"></label>' +
      '<div class="acts"><button class="btn" data-act="close">Cancelar</button><button class="btn fill" data-act="saveCupo">Guardar</button></div>');
  };
  ACT.saveCupo = (ds, el) => {
    const sh = el.closest('.sheet');
    const f = formData(sh);
    const raw = (f.cupo || '').trim();
    const v = raw ? parseInt(raw.replace(/\D/g, ''), 10) : 0;
    if (raw && !(v > 0)) return bad(sh, 'cupo', 'Escribe el cupo en números');
    closeTop();
    write(() => S.db.doc('ajustes/boda').set(Object.assign({}, S.aj, { cupo: v || 0, enlace: (f.enlace || '').trim() })), 'Guardado');
  };

  /* ---------- Eventos ---------- */
  document.addEventListener('click', (e) => {
    const el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    const fn = ACT[el.getAttribute('data-act')];
    if (!fn) return;
    e.preventDefault();
    fn(el.dataset, el);
  });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'iq') { UI.iq = t.value; render(); return; }
    if (t.classList && t.classList.contains('err')) t.classList.remove('err');
    const sh = t.closest && t.closest('.sheet');
    if (sh) preview(sh);
  });
  document.addEventListener('change', (e) => {
    const sh = e.target.closest && e.target.closest('.sheet');
    if (sh) { syncIf(sh); preview(sh); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.id === 'qp' && (e.key === 'Enter' || e.keyCode === 13)) { e.preventDefault(); quickPend(); } else if (e.key === 'Escape') closeTop();
  });

  /* ---------- Conexión con los datos compartidos ---------- */
  function loadNames() {
    if (!S.user || typeof S.user.profiles !== 'function') return;
    const ids = [];
    [S.gastos, S.pend, S.inv].forEach((arr) => arr.forEach((x) => [x.creadoPor, x.hechoPor].forEach((id) => {
      if (id && id !== S.me && !S.asked[id]) { S.asked[id] = 1; ids.push(id); }
    })));
    if (!ids.length) return;
    S.user.profiles(ids).then((ps) => {
      ids.forEach((id) => { S.names[id] = (ps && ps[id] && ps[id].name) || ''; });
      if (S.state === 'ok') render();
    }).catch(() => { /* sin nombres */ });
  }
  function subscribe() {
    const got = { gastos: false, pend: false, inv: false, aj: false };
    const arrived = (k) => {
      got[k] = true;
      if (S.state === 'loading' && got.gastos && got.pend && got.inv && got.aj) S.state = 'ok';
      if (S.state === 'ok') { render(); loadNames(); }
    };
    const onErr = (again) => (e) => {
      const c = e && e.code;
      if (c === 'unavailable') { setTimeout(again, 2500); return; }
      if (c === 'revoked' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') { S.state = 'nodb'; render(); return; }
      toast('No se pudieron leer los datos');
    };
    [['gastos', 'gastos'], ['pend', 'pendientes'], ['inv', 'invitados']].forEach((x) => {
      const sub = () => col(x[1]).onSnapshot((snap) => {
        S[x[0]] = snap.docs.map((d) => Object.assign({}, d.data() || {}, { id: d.id }));
        arrived(x[0]);
      }, onErr(sub));
      sub();
    });
    const subAj = () => S.db.doc('ajustes/boda').onSnapshot((d) => { S.aj = (d.exists && d.data()) || {}; arrived('aj'); }, onErr(subAj));
    subAj();
  }
  function boot() {
    tick();
    setInterval(tick, 60000);
    render();
    if (!window.claude || typeof window.claude.use !== 'function') { S.state = 'nodb'; render(); return; }
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then((r) => {
      const db = r[0];
      const user = r[1];
      S.user = user || null;
      window.__setMe = (n) => { S.me = n || null; };
      if (!db) { S.state = 'nodb'; render(); return; }
      S.db = db;
      if (user) {
        Promise.resolve(user.id ? user.id() : null).then((id) => { S.me = id || null; }).catch(() => { /* */ });
        Promise.resolve(user.can ? user.can('data.write') : null).then((c) => { if (c === false) { S.canWrite = false; render(); } }).catch(() => { /* */ });
      }
      subscribe();
    }, () => { S.state = 'nodb'; render(); });
  }
  boot();
})();
</script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});</script>
</body>
</html>
